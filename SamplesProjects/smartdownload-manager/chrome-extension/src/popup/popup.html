<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #18181b;
      color: #fafafa;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #27272a;
      padding-bottom: 10px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 600;
    }
    .status-on { background: #064e3b; color: #34d399; }
    .status-off { background: #7f1d1d; color: #f87171; }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #a1a1aa;
      margin: 12px 0 6px 0;
    }
    .media-card {
      background: #27272a;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .media-title {
      font-size: 12px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .qualities {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .btn-quality {
      background: #3f3f46;
      border: none;
      color: #fff;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-quality:hover { background: #0284c7; }
    .footer-btn {
      width: 100%;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px;
      font-weight: 600;
      font-size: 12px;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ SmartDownload</div>
    <span class="status-badge status-on" id="status-badge">Connected</span>
  </div>

  <div class="section-title">Media On This Page</div>
  <div id="media-list">
    <div class="media-card">
      <div class="media-title">Video Stream Detected</div>
      <div class="qualities">
        <button class="btn-quality" data-quality="1080p">1080p MP4 (245MB)</button>
        <button class="btn-quality" data-quality="720p">720p MP4 (145MB)</button>
        <button class="btn-quality" data-quality="Audio">320k Audio (8MB)</button>
      </div>
    </div>
  </div>

  <button class="footer-btn" id="open-manager-btn">Open Download Manager</button>
</body>
</html>
