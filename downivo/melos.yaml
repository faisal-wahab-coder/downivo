name: downivo
repository: https://github.com/faisal-wahab-coder/downivo

packages:
  - apps/mobile
  - apps/web
  - packages/app_core
  - packages/analytics
  - packages/browser
  - packages/content_intake
  - packages/database
  - packages/design_system
  - packages/download_engine
  - packages/job_manager
  - packages/media_library
  - packages/navigation
  - packages/notifications
  - packages/performance
  - packages/permissions
  - packages/shared_types
  - packages/shared_utils
  - packages/storage
  - packages/search
  - packages/universal_viewer

command:
  bootstrap:
    runPubGetInParallel: true

scripts:
  analyze:
    run: melos exec -- flutter analyze
    description: Run flutter analyze in all packages.

  test:
    run: melos exec -- flutter test
    description: Run tests in all packages.

  qa:
    run: bash qa/runner/qa_runner.sh
    description: Run the master QA regression suite.

  format:
    run: melos exec -- dart format .
    description: Format all packages.

  build:apk:
    run: bash scripts/build_release_apk.sh
    description: Build an arm64 Android release APK for sideload testing.
