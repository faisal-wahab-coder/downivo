name: app_core
description: Application bootstrap, configuration, and global providers.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  shared_preferences: ^2.5.3
  analytics:
