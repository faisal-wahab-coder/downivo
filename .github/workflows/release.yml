name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universal_downloader
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate
        run: bash scripts/ci.sh

      - name: Build Android App Bundle
        run: |
          cd apps/mobile
          flutter pub get
          flutter build appbundle --release

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.ref_name }}
          path: |
            universal_downloader/apps/mobile/build/app/outputs/bundle/release/app-release.aab
            universal_downloader/apps/mobile/build/app/outputs/mapping/release/mapping.txt
